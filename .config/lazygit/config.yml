# Esc quits once nothing is left to close.
quitOnTopLevelReturn: true
# Return from Neovim without a prompt.
promptToReturnFromSubprocess: false
# No release-notes popup after an upgrade.
disableStartupPopups: true
git:
  diffRenderers:
    # delta without background blocks, which show as black slabs on Ghostty's
    # see-through background. Only changed words get a tint. No filename banner
    # or box above each change, so more code fits.
    - command: >-
        delta --dark --paging=never --line-numbers --keep-plus-minus-markers
        --file-style=omit --hunk-header-style=omit
        --syntax-theme='Catppuccin Mocha'
        --plus-style='syntax' --plus-emph-style='syntax #404f4a'
        --minus-style='#f38ba8' --minus-emph-style='#f38ba8 #53394c'
        --line-numbers-plus-style='#a6e3a1' --line-numbers-minus-style='#f38ba8'
gui:
  theme:
    # Soft grey selected row.
    selectedLineBgColor: ['#45475a']
  # j, k and Space act on a whole block in the diff; a switches to single lines.
  useHunkModeInDiffView: true
  # Scroll the diff 10 lines at a time.
  scrollHeight: 10
  # Hide the command log and startup tip.
  showCommandLog: false
  showRandomTip: false
  # The focused left-hand panel is 5 times as tall as the others.
  expandFocusedSidePanel: true
  expandedSidePanelWeight: 5
  # File-type and branch icons.
  nerdFontsVersion: "3"
  # Lines added and removed next to each file.
  showNumstatInFilesView: true
  # Full paths instead of a tree; ` switches.
  showFileTree: false
  # No stash panel or submodules and reflog tabs; worktrees sit behind files,
  # where ] reaches them.
  sidePanels:
    - [status]
    - [files, worktrees]
    - [branches, remotes, tags]
    - [commits]
# Keys that change the repo are off, except Space (stage, check out a branch)
# and d (discard, drop, delete). Each comment names the key switched off.
keybinding:
  universal:
    # Top and bottom of a list or diff.
    gotoTop: g
    gotoBottom: G
    prevItem: <disabled> # Up; k still moves up
    nextItem: <disabled> # Down; j still moves down
    prevBlock: <disabled> # Left; h still goes to the previous panel
    nextBlock: <disabled> # Right; l still goes to the next panel
    rangeSelectUp: <disabled> # Shift+Up
    rangeSelectDown: <disabled> # Shift+Down
    decreaseContextInDiffView: <disabled> # {
    increaseContextInDiffView: <disabled> # }
    pushFiles: <disabled> # P
    pullFiles: <disabled> # p
    undo: <disabled> # z
    redo: <disabled> # Z
    executeShellCommand: <disabled> # :
    createRebaseOptionsMenu: <disabled> # m
    createPatchOptionsMenu: <disabled> # ctrl+p
    new: <disabled> # n, create a branch
    newWorktree: <disabled> # w
  files:
    commitChanges: <disabled> # c
    commitChangesWithoutHook: <disabled> # w
    commitChangesWithEditor: <disabled> # C
    amendLastCommit: <disabled> # A
    findBaseCommitForFixup: <disabled> # ctrl+f
    toggleStagedAll: <disabled> # a
    stashAllChanges: <disabled> # s
    viewStashOptions: <disabled> # S
    viewResetOptions: <disabled> # D, discard menu
    ignoreFile: <disabled> # i
    fetch: <disabled> # f
    openMergeOptions: <disabled> # M
  branches:
    checkoutBranchByName: <disabled> # c
    forceCheckoutBranch: <disabled> # F
    checkoutPreviousBranch: <disabled> # -
    rebaseBranch: <disabled> # r
    renameBranch: <disabled> # R
    mergeIntoCurrentBranch: <disabled> # M
    moveCommitsToNewBranch: <disabled> # N
    fastForward: <disabled> # f
    fetchRemote: <disabled> # f, in the Remotes tab
    createTag: <disabled> # T
    pushTag: <disabled> # P
    setUpstream: <disabled> # u
    createPullRequest: <disabled> # o
    viewPullRequestOptions: <disabled> # O
    openPullRequestInBrowser: <disabled> # G
    addForkRemote: <disabled> # F, in the Remotes tab
    viewGitFlowOptions: <disabled> # i
  commits:
    checkoutCommit: <disabled> # Space
    viewResetOptions: <disabled> # g, reset menu
    squashDown: <disabled> # s
    markCommitAsFixup: <disabled> # f
    createFixupCommit: <disabled> # F
    squashAboveCommits: <disabled> # S
    setFixupMessage: <disabled> # c
    renameCommit: <disabled> # r, edit the commit message
    renameCommitWithEditor: <disabled> # R
    moveDownCommit: <disabled> # ctrl+j
    moveUpCommit: <disabled> # ctrl+k
    amendToCommit: <disabled> # A
    resetCommitAuthor: <disabled> # a
    startInteractiveRebase: <disabled> # i
    pickCommit: <disabled> # p
    markCommitAsBaseForRebase: <disabled> # B
    revertCommit: <disabled> # t
    cherryPickCopy: <disabled> # C
    pasteCommits: <disabled> # V
    tagCommit: <disabled> # T
    viewBisectOptions: <disabled> # b
    openPullRequestInBrowser: <disabled> # G
  commitFiles:
    checkoutCommitFile: <disabled> # c, restore file from the commit
  main:
    # Jump between changes in the diff.
    prevHunk: <disabled> # Left and h
    nextHunk: <disabled> # Right and l
